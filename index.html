<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

      tailwind.config = {

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

    <style>
      html {
        scroll-behavior: smooth;
      }
      /* Gentle custom scrollbar (desktop) */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f9f5ff;
      }
      ::-webkit-scrollbar-thumb {
        background: #c4a5f6;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a855f7;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      
      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      
      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      
      @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }
      
      .animate-fadeInUp {
        animation: fadeInUp 0.6s ease-out forwards;
      }
      
      .animate-fadeIn {
        animation: fadeIn 0.6s ease-out forwards;
      }
      
      .animate-slideInRight {
        animation: slideInRight 0.6s ease-out forwards;
      }
      
      .animate-slideInLeft {
        animation: slideInLeft 0.6s ease-out forwards;
      }
      
      .animate-scaleIn {
        animation: scaleIn 0.5s ease-out forwards;
      }
      
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      
      .animate-pulse-slow {
        animation: pulse 3s ease-in-out infinite;
      }
      
      /* Mobile menu animations */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .mobile-menu-enter {
        animation: slideDown 0.3s ease-out forwards;
      }
      
      /* Hamburger menu animation */
      .hamburger-line {
        transition: all 0.3s ease;
      }
      
      .hamburger-active .hamburger-line:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
      }
      
      .hamburger-active .hamburger-line:nth-child(2) {
        opacity: 0;
      }
      
      .hamburger-active .hamburger-line:nth-child(3) {
        transform: rotate(-45deg) translate(7px, -6px);
      }
      
      /* Smooth transitions */
      * {
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Mobile optimizations */
      @media (max-width: 640px) {
        .mobile-text-sm {
          font-size: 0.875rem;
        }
        .mobile-padding {
          padding: 1rem;
        }
      }
      
      /* Intersection Observer fade-in */
      .fade-in-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      
      .fade-in-on-scroll.visible {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Button hover effects */
      .btn-hover-effect {
        position: relative;
        overflow: hidden;
      }
      
      .btn-hover-effect::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }
      
      .btn-hover-effect:hover::before {
        width: 300px;
        height: 300px;
      }
    </style>
  </head>

  <body class="bg-primary-50 text-slate-900 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const servicesData = [
        {
          title: 'Женские стрижки и укладки',
          description:
            'Индивидуальный подбор формы и длины, уходовые процедуры и безупречные укладки для любого случая.',
          tag: 'Для женщин',
          image:
            './images/woman_haircut.jpg',
        },
        {
          title: 'Мужские стрижки',
          description:
            'Современные мужские образы, аккуратные стрижки и укладки с учётом ваших предпочтений.',
          tag: 'Для мужчин',
          image:
            'https://images.pexels.com/photos/3998429/pexels-photo-3998429.jpeg?auto=compress&cs=tinysrgb&w=1200',
        },
        {
          title: 'Маникюр',
          description:
            'Классический, аппаратный и комбинированный маникюр, выверенная форма и аккуратный кутикул.',
          tag: 'Ногтевой сервис',
          image:
            './images/manicure.jpg',
        },
        {
          title: 'Педикюр',
          description:
            'Уход за стопами, эстетический и лечебный педикюр в атмосфере полного расслабления.',
          tag: 'Ногтевой сервис',
          image:
            './images/pedicure.jpg',
        },
        {
          title: 'Окрашивание волос',
          description:
            'Деликатные техники окрашивания, блонд, шатуш, омбре, а также восстановление и уход.',
          tag: 'Цвет и уход',
          image:
            './images/haircolor.jpg',
        },
        {
          title: 'Макияж',
          description:
            'Дневной, вечерний и свадебный макияж, подчеркивающий естественную женственность и красоту.',
          tag: 'Make-up',
          image:
            './images/makeup.jpg', 
        },
        {
          title: 'Другие бьюти-услуги',
          description:
            'Брови, ресницы, уходовые процедуры и комплексные программы преображения для вас.',
          tag: 'Beauty',
          image:
            './images/other.jpg',
        },
      ];

      const scrollToSection = (id) => {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      const openWhatsApp = () => {
        const phoneNumber = '77073865203';
        const message = encodeURIComponent('Здравствуйте! Хочу записаться в салон Jadyra. Подскажите, пожалуйста, свободное время для записи.');
        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
        window.open(whatsappUrl, '_blank');
      };

      const BookingModal = ({ isOpen, onClose }) => {
        const [form, setForm] = useState({
          name: '',
          phone: '',
          service: '',
          date: '',
          time: '',
          message: '',
        });

        useEffect(() => {
          if (isOpen) {
            document.body.style.overflow = 'hidden';
          } else {
            document.body.style.overflow = '';
          }
          return () => {
            document.body.style.overflow = '';
          };
        }, [isOpen]);

        if (!isOpen) return null;

        const handleChange = (e) => {
          const { name, value } = e.target;
          setForm((prev) => ({ ...prev, [name]: value }));
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          alert(
            'Спасибо за вашу заявку, ' +
              (form.name || 'клиент') +
              '! Мы свяжемся с вами для подтверждения записи.'
          );
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center px-4 sm:px-6 animate-fadeIn">
            <div
              className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm animate-fadeIn"
              onClick={onClose}
            />
            <div className="relative w-full max-w-lg rounded-3xl bg-white/95 p-6 sm:p-8 shadow-soft animate-scaleIn">
              <button
                className="absolute right-4 top-4 rounded-full bg-primary-50 px-2 py-1 text-xs font-medium text-primary-700 hover:bg-primary-100 transition-all hover:scale-110"
                onClick={onClose}
              >
                ✕ Закрыть
              </button>
              <h2 className="mb-2 text-center font-display text-2xl sm:text-3xl font-semibold text-primary-800">
                Записаться в салон Jadyra
              </h2>
              <p className="mb-6 text-center text-sm text-slate-600">
                Оставьте ваши данные, и наш администратор перезвонит вам для уточнения деталей.
              </p>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div className="grid gap-4 sm:grid-cols-2">
                  <div>
                    <label className="mb-1 block text-sm font-medium text-slate-700">
                      Имя
                    </label>
                    <input
                      required
                      type="text"
                      name="name"
                      value={form.name}
                      onChange={handleChange}
                      className="w-full rounded-2xl border border-primary-100 bg-primary-50/60 px-3 py-2.5 text-sm shadow-sm outline-none transition-all focus:border-primary-400 focus:bg-white focus:ring-2 focus:ring-primary-200 focus:scale-[1.02]"
                      placeholder="Как к вам обращаться"
                    />
                  </div>
                  <div>
                    <label className="mb-1 block text-sm font-medium text-slate-700">
                      Телефон
                    </label>
                    <input
                      required
                      type="tel"
                      name="phone"
                      value={form.phone}
                      onChange={handleChange}
                      className="w-full rounded-2xl border border-primary-100 bg-primary-50/60 px-3 py-2.5 text-sm shadow-sm outline-none transition-all focus:border-primary-400 focus:bg-white focus:ring-2 focus:ring-primary-200 focus:scale-[1.02]"
                      placeholder="+7 ___ ___ __ __"
                    />
                  </div>
                </div>
                <div className="grid gap-4 sm:grid-cols-2">
                  <div>
                    <label className="mb-1 block text-sm font-medium text-slate-700">
                      Услуга
                    </label>
                    <select
                      name="service"
                      value={form.service}
                      onChange={handleChange}
                      className="w-full rounded-2xl border border-primary-100 bg-primary-50/60 px-3 py-2.5 text-sm shadow-sm outline-none transition-all focus:border-primary-400 focus:bg-white focus:ring-2 focus:ring-primary-200 focus:scale-[1.02]"
                    >
                      <option value="">Выберите услугу</option>
                      <option>Женская стрижка и укладка</option>
                      <option>Мужская стрижка</option>
                      <option>Маникюр</option>
                      <option>Педикюр</option>
                      <option>Окрашивание волос</option>
                      <option>Макияж</option>
                      <option>Комплексное преображение</option>
                      <option>Другое</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="mb-1 block text-sm font-medium text-slate-700">
                        Дата
                      </label>
                      <input
                        type="date"
                        name="date"
                        value={form.date}
                        onChange={handleChange}
                        className="w-full rounded-2xl border border-primary-100 bg-primary-50/60 px-3 py-2.5 text-sm shadow-sm outline-none transition-all focus:border-primary-400 focus:bg-white focus:ring-2 focus:ring-primary-200 focus:scale-[1.02]"
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-sm font-medium text-slate-700">
                        Время
                      </label>
                      <input
                        type="time"
                        name="time"
                        value={form.time}
                        onChange={handleChange}
                        className="w-full rounded-2xl border border-primary-100 bg-primary-50/60 px-3 py-2.5 text-sm shadow-sm outline-none transition-all focus:border-primary-400 focus:bg-white focus:ring-2 focus:ring-primary-200 focus:scale-[1.02]"
                      />
                    </div>
                  </div>
                </div>
                <div>
                  <label className="mb-1 block text-sm font-medium text-slate-700">
                    Пожелания
                  </label>
                  <textarea
                    name="message"
                    value={form.message}
                    onChange={handleChange}
                    rows="3"
                    className="w-full rounded-2xl border border-primary-100 bg-primary-50/60 px-3 py-2.5 text-sm shadow-sm outline-none transition-all focus:border-primary-400 focus:bg-white focus:ring-2 focus:ring-primary-200 focus:scale-[1.02]"
                    placeholder="Например: желаемая длина, форма, особые пожелания..."
                  />
                </div>
                <button
                  type="submit"
                  className="mt-2 flex w-full items-center justify-center rounded-full bg-primary-600 px-4 py-3 text-sm font-semibold text-white shadow-soft transition-all hover:bg-primary-700 hover:scale-105 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-300 btn-hover-effect"
                >
                  Отправить заявку
                  <span className="ml-2 animate-pulse">✨</span>
                </button>
                <p className="text-center text-xs text-slate-500">
                  Нажимая на кнопку, вы соглашаетесь с обработкой персональных данных.
                </p>
              </form>
            </div>
          </div>
        );
      };

      const App = () => {
        const [isBookingOpen, setIsBookingOpen] = useState(false);
        const [showFab, setShowFab] = useState(false);
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

        useEffect(() => {
          const onScroll = () => {
            setShowFab(window.scrollY > 200);
          };
          window.addEventListener('scroll', onScroll);
          return () => window.removeEventListener('scroll', onScroll);
        }, []);

        // Intersection Observer for scroll animations
        useEffect(() => {
          const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px',
          };

          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
              }
            });
          }, observerOptions);

          const elements = document.querySelectorAll('.fade-in-on-scroll');
          elements.forEach((el) => observer.observe(el));

          return () => {
            elements.forEach((el) => observer.unobserve(el));
          };
        }, []);

        const openBooking = () => {
          setIsBookingOpen(true);
          setIsMobileMenuOpen(false);
        };
        const closeBooking = () => setIsBookingOpen(false);
        
        const toggleMobileMenu = () => setIsMobileMenuOpen(!isMobileMenuOpen);
        
        const handleMobileNavClick = (sectionId) => {
          scrollToSection(sectionId);
          setIsMobileMenuOpen(false);
        };

        return (
          <div className="relative min-h-screen">
            {/* Gradient background accents */}
            <div className="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
              <div className="absolute -left-20 -top-32 h-72 w-72 rounded-full bg-primary-200/50 blur-3xl" />
              <div className="absolute -right-10 top-40 h-80 w-80 rounded-full bg-primary-300/40 blur-3xl" />
              <div className="absolute bottom-0 left-10 h-72 w-72 rounded-full bg-accent-200/60 blur-3xl" />
            </div>

            {/* Navbar */}
            <header className="sticky top-0 z-30 border-b border-primary-100/60 bg-white/80 backdrop-blur-xl">
              <div className="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6 sm:py-4">
                <div
                  className="flex cursor-pointer items-center gap-3 animate-fadeIn"
                  onClick={() => scrollToSection('hero')}
                >
                  <div className="flex h-9 w-9 items-center justify-center rounded-full bg-primary-100 text-primary-700 shadow-card transition-transform hover:scale-110">
                    <span className="text-lg font-semibold">J</span>
                  </div>
                  <div>
                    <div className="font-display text-xl font-semibold tracking-wide text-primary-800">
                      Jadyra
                    </div>
                    <div className="text-xs font-medium uppercase tracking-[0.15em] text-primary-500">
                      Beauty Studio
                    </div>
                  </div>
                </div>
                <nav className="hidden items-center gap-8 text-sm font-medium text-slate-700 md:flex">
                  <button
                    className="transition-all hover:text-primary-700 hover:scale-105"
                    onClick={() => scrollToSection('services')}
                  >
                    Услуги
                  </button>
                  <button
                    className="transition-all hover:text-primary-700 hover:scale-105"
                    onClick={() => scrollToSection('about')}
                  >
                    О салоне
                  </button>
                  <button
                    className="transition-all hover:text-primary-700 hover:scale-105"
                    onClick={() => scrollToSection('contact')}
                  >
                    Контакты
                  </button>
                </nav>
                <div className="flex items-center gap-3">
                  <button
                    onClick={openBooking}
                    className="hidden rounded-full bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-soft transition-all hover:bg-primary-700 hover:scale-105 hover:-translate-y-0.5 md:inline-flex btn-hover-effect"
                  >
                    Записаться
                  </button>
                  {/* Mobile menu button */}
                  <button
                    onClick={toggleMobileMenu}
                    className="flex flex-col gap-1.5 rounded-lg p-2 transition-all hover:bg-primary-50 md:hidden"
                    aria-label="Меню"
                  >
                    <span className={`hamburger-line h-0.5 w-6 rounded-full bg-primary-700 transition-all ${isMobileMenuOpen ? 'hamburger-active' : ''}`} />
                    <span className={`hamburger-line h-0.5 w-6 rounded-full bg-primary-700 transition-all ${isMobileMenuOpen ? 'hamburger-active' : ''}`} />
                    <span className={`hamburger-line h-0.5 w-6 rounded-full bg-primary-700 transition-all ${isMobileMenuOpen ? 'hamburger-active' : ''}`} />
                  </button>
                </div>
              </div>
              
              {/* Mobile Menu */}
              {isMobileMenuOpen && (
                <div className="mobile-menu-enter border-t border-primary-100/60 bg-white/95 backdrop-blur-xl md:hidden">
                  <nav className="mx-auto max-w-6xl px-4 py-4 space-y-3">
                    <button
                      onClick={() => handleMobileNavClick('services')}
                      className="block w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-700 transition-all hover:bg-primary-50 hover:text-primary-700 hover:scale-[1.02]"
                    >
                      ✨ Услуги
                    </button>
                    <button
                      onClick={() => handleMobileNavClick('about')}
                      className="block w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-700 transition-all hover:bg-primary-50 hover:text-primary-700 hover:scale-[1.02]"
                    >
                      💜 О салоне
                    </button>
                    <button
                      onClick={() => handleMobileNavClick('contact')}
                      className="block w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-700 transition-all hover:bg-primary-50 hover:text-primary-700 hover:scale-[1.02]"
                    >
                      📍 Контакты
                    </button>
                    <button
                      onClick={openBooking}
                      className="mt-2 w-full rounded-full bg-primary-600 px-4 py-3 text-sm font-semibold text-white shadow-soft transition-all hover:bg-primary-700 hover:scale-105"
                    >
                      Записаться ♡
                    </button>
                  </nav>
                </div>
              )}
            </header>

            <main className="mx-auto max-w-6xl px-4 pb-20 pt-6 sm:px-6 sm:pb-20 sm:pt-12 lg:pt-16">
              {/* Hero Section */}
              <section
                id="hero"
                className="grid items-center gap-8 pb-12 pt-4 sm:gap-10 sm:pb-16 md:grid-cols-[minmax(0,1.1fr),minmax(0,0.9fr)] md:pb-20 lg:gap-14 lg:pb-24"
              >
                <div className="space-y-7 fade-in-on-scroll">
                  <div className="inline-flex items-center gap-2 rounded-full bg-white/80 px-3 py-1 text-xs font-medium text-primary-700 shadow-card ring-1 ring-primary-100/80 animate-pulse-slow">
                    <span className="h-1.5 w-1.5 rounded-full bg-primary-500 animate-pulse" />
                    Женский салон красоты в Таразе
                  </div>
                  <div>
                    <h1 className="font-display text-4xl leading-tight text-slate-900 sm:text-5xl lg:text-6xl">
                      Женственность
                      <br />
                      <span className="bg-gradient-to-r from-primary-500 via-primary-700 to-primary-500 bg-clip-text text-transparent animate-fadeIn">
                        в каждом штрихе
                      </span>
                    </h1>
